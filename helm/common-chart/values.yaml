nameOverride: ""
fullnameOverride: ""


replicaCount : 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: "" 

service: 
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"   

autoscaling: 
  enabled: false
  
  minReplicas: 1 
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70


readinessProbe:
  enabled: true
  httpGet:
    path: /health
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  enabled: true
  httpGet:
    path: /health
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

configMap:
  enabled: false
  immutable: true
  data: {}

secret:
  enabled: false
  immutable: true
  data: {}