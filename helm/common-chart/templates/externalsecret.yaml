{{- if .Values.externalSecret.enabled }}

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: {{ include "common-chart.fullname" . }}

  labels:
    {{- include "common-chart.labels" . | nindent 4 }}

spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }} 

  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore

  target:
    # matches include "common-chart.fullname" exactly - deployment.yaml's
    # existing secretRef (envFrom) needs no change, it just picks up
    # whichever Secret object exists with this name
    name: {{ include "common-chart.fullname" . }}

  # extract pulls every key from the AWS secret's JSON blob (JWT_SECRET,
  # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD) and flattens them
  # into the resulting Kubernetes Secret's data, so nothing needs listing
  # individually here - it stays correct even if the AWS secret's keys
  # change later.     
  dataFrom:
    - extract:
         key: {{ .Values.externalSecret.remoteSecretName }}
{{- end }}