{{- if .Values.serviceAccount.create }}

apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ include "common-chart.serviceAccountName" . }}

  labels: 
    {{- include "common-chart.labels" . | nindent 4 }}

  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end -}}     

{{- end -}}  