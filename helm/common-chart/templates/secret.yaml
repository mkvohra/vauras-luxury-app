{{- if .Values.secret.enabled }}

apiVersion: v1 
kind: Secret 

metadata: 
  name: {{ include "common-chart.fullname" . }}

  labels: 
    {{- include "common-chart.labels" . | nindent 4 }}

type: Opaque 
immutable: {{ .Values.secret.immutable }}

stringData: 
  {{- range $key, $value := .Values.secret.data }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
