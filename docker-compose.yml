
services:
  auth:
    depends_on:
      - mysql
    build: ./auth-service
    ports:
      - "3000:3000"

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}  

  cart:
    depends_on:
      - mysql  
    build: ./cart-service
    ports:
      - "3001:3001"

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}  

  frontend:
    build: ./frontend
    ports:
      - "80:80"

  mysql:
    image: mysql:8
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: luxe_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql    


  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml


  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3002:3000"






volumes:
  mysql_data: