name: "Terraform context setup"
description: "Checkout the target commit, authenticate to AWS via OIDC, and install Terraform"
 
inputs:
  ref:
    description: "Commit SHA to check out (should be detect's sha_after)"
    required: true
  role-to-assume:
    description: "IAM role ARN to assume via OIDC"
    required: true
  aws-region:
    description: "AWS region"
    required: true
 
runs:
  using: "composite"
  steps:
    - name: Checkout target commit
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
 
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
 
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
