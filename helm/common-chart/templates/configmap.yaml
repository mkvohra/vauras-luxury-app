{{- if .Values.configMap.enabled }}

apiVersion: v1 
kind: ConfigMap

metadata: 
  name: {{ include "common-chart.fullname" . }}
  
  labels:
    {{- include "common-chart.labels" . | nindent 4 }}

immutable: {{ .Values.configMap.immutable }}    

data: 
{{- range $key, $value := .Values.configMap.data }}    
  {{ $key }}: {{ $value | quote }}
{{- end }}

{{- end }}