replicaCount: 1
namespace: auth

image: 
  repository: "<ecr_auth_repository_link>"
  tag: "dev-latest"
  pullPolicy: IfNotPresent

service: 
  type: ClusterIP
  port: 80
  targetPort: 3000

configMap:
  enabled: true

  data: 
    NODE_ENV: development
    PORT: "3000"

secret:
  enabled: true 

  data:
    JWT_SECRET: ""
    DB_HOST: ""
    DB_PORT: "" 
    DB_NAME: "" 
    DB_USER: "" 
    DB_PASSWORD: ""  

autoscaling: 
  enabled: false 

resources:
  requests:
    cpu: 100m 
    memory: 128Mi

  limits:
    cpu: 500m 
    memory: 512Mi    

readinessProbe:
  httpGet:
    path: /api/auth/health    


livenessProbe:
  httpGet:
    path: /api/auth/health   